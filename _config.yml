title: Kings Fraternity
subtitle: "Brotherhood, Leadership, and Community"
email: contact@kingsfraternity.org
description: >-
  The official website of Kings Fraternity — brotherhood, leadership, and community.
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
remote_theme: bencentra/centrarium
markdown: kramdown

# Suppress Dart Sass deprecation warnings from third-party SCSS (Bourbon 4.x)
sass:
  quiet_deps: true
inter_post_navigation: true
highlightjs_theme: "monokai-sublime"

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-paginate-v2

# Pagination settings
pagination:
  enabled: true
  per_page: 5
  permalink: "/page/:num/"
  sort_reverse: true

# Archive settings
jekyll-archives:
  enabled:
    - categories
    - tags
    - year
    - month
  layout: 'archive'
  layouts:
    year: 'year_archive'
    month: 'month_archive'
  permalinks:
    category: '/category/:name/'
    tag: '/tag/:name/'
    year: '/archive/:year/'
    month: '/archive/:year/:month/'

# Social icons
social:
  - name: GitHub
    icon: github
    username: KingsFraternity
    url: https://github.com/KingsFraternity
    desc: Find us on GitHub
    share: false
